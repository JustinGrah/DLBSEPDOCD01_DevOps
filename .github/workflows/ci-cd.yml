name: Support-Ticket CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Code prüfen und testen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Anwendung auf Syntaxfehler prüfen
        run: |
          node --check src/app.js
          node --check src/server.js
          node --check src/routes/tickets.js
          node --check src/data/tickets.js

  publish:
    name: Docker-Image veröffentlichen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten erstellen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justingrah/dlbsepdocd01_devops

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/justingrah/dlbsepdocd01_devops:latest
            ghcr.io/justingrah/dlbsepdocd01_devops:${{ github.sha }}
